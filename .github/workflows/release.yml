name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.10)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Determine version from tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set version in package.json
        shell: bash
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          node -e "
            const fs = require('fs');
            const p = 'package.json';
            const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
            pkg.version = '$VERSION';
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Rebuild native modules for Electron's ABI
        run: npx electron-builder install-app-deps

      # electron-vite build (dальше) копирует нативные .node-бинарники,
      # на которые ссылаются забандленные зависимости (ssh2 → cpu-features,
      # ssh2 → его собственный sshcrypto.node), внутрь чанков бандла — и
      # переписывает их require() мимо try/catch, которым сами зависимости
      # их оборачивают. Если на этот момент бинарники ещё собраны под
      # Node.js раннера (после npm ci), а не под Electron, скопированная
      # копия так и останется с чужим ABI навсегда — electron-builder'овский
      # автоматический @electron/rebuild чуть позже увидит и починит только
      # оригиналы в node_modules, а не эту уже сделанную копию. Явный
      # install-app-deps здесь, до сборки бандла, гарантирует, что копировать
      # будет уже нечего чинить.
      - name: Build renderer and main bundles
        run: npm run build

      - name: Build installer
        run: npx electron-builder --win --x64 --publish never

      - name: Generate latest.yml
        shell: bash
        run: |
          # GitHub нормализует имена ассетов со спецсимволами (пробелы → точки),
          # поэтому latest.yml обязан ссылаться на нормализованное имя.
          VERSION="${{ steps.tag.outputs.version }}"
          EXE="release/Remote Hub Setup ${VERSION}.exe"
          NAME="Remote.Hub.Setup.${VERSION}.exe"
          node -e "
            const fs = require('fs');
            const crypto = require('crypto');
            const v = process.argv[1];
            const exe = process.argv[2];
            const name = process.argv[3];
            const buf = fs.readFileSync(exe);
            // electron-updater сверяет sha512 как base64-дайджест (не hex).
            const sha512 = crypto.createHash('sha512').update(buf).digest('base64');
            const size = buf.length;
            const date = new Date().toISOString();
            const yml =
              'version: ' + v + '\n' +
              'files:\n' +
              '  - url: ' + name + '\n' +
              '    sha512: ' + sha512 + '\n' +
              '    size: ' + size + '\n' +
              'path: ' + name + '\n' +
              'sha512: ' + sha512 + '\n' +
              'releaseDate: \\'' + date + '\\'\n';
            fs.writeFileSync('release/latest.yml', yml);
            console.log(yml);
          " "$VERSION" "$EXE" "$NAME"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            release/Remote Hub Setup ${{ steps.tag.outputs.version }}.exe
            release/latest.yml
