name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.10)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # package.json's "allowScripts" allowlists only bufferutil/utf-8-validate —
      # everything else's install/postinstall scripts, including ssh2's own
      # `node install.js`, are meant to be blocked. The npm that ships with
      # actions/setup-node's node-version: 20 predates npm's allowScripts
      # enforcement and runs every script regardless, silently ignoring that
      # policy. That's how ssh2's install.js (lib/protocol/crypto's own
      # `node-gyp rebuild --target=${process.version}`, hardcoded to whatever
      # Node runs the script — never Electron's) got to compile its optional
      # native crypto binding, and its optional cpu-features dependency, both
      # against this runner's plain Node.js ABI. @electron/rebuild never
      # rebuilds either afterwards — its dependency walker doesn't recognize
      # ssh2's self-managed crypto build or cpu-features as needing a redo —
      # so the wrong-ABI binaries shipped as-is in v0.1.15 through v0.1.19.
      # Both are purely optional performance accelerators with a full pure-JS
      # fallback already coded (see ssh2/lib/protocol/crypto's own try/catch
      # and cpu-features' own guarded require in ssh2/lib/protocol/constants.js) —
      # never building them is strictly safer than building them for the
      # wrong runtime. A current npm enforces the allowlist already declared
      # in package.json, so this npm ci simply never runs those scripts.
      - run: npm install -g npm@11

      - run: npm ci

      - name: Determine version from tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Release gates — fail fast before any expensive build work.
      #  1) npm audit: a release must not ship with known high/critical
      #     vulnerabilities in the dependency tree.
      #  2) version sync: package.json must already equal the pushed tag.
      #     This step sits BEFORE the "Set version in package.json" step on
      #     purpose: that step would otherwise overwrite the drift and hide
      #     it. Catches tags pushed from a commit whose package.json drifted
      #     (the v0.1.15–v0.1.19 pattern, docs/release-playbook.md §4).
      - name: Release gates — npm audit + version sync with the tag
        shell: bash
        run: |
          npm audit --audit-level=high
          VERSION="${{ steps.tag.outputs.version }}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag v$VERSION."
            echo "::error::Sync package.json to the release version, commit, and re-tag."
            exit 1
          fi
          echo "release gates OK: audit clean, package.json == $VERSION"

      - name: Set version in package.json
        shell: bash
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          node -e "
            const fs = require('fs');
            const p = 'package.json';
            const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
            pkg.version = '$VERSION';
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Rebuild native modules for Electron's ABI
        run: npx electron-builder install-app-deps

      # @electron/rebuild's dependency walker only recognizes top-level
      # node_modules packages with their own prebuild-install/node-gyp-build
      # convention (confirmed in these very logs: it lists bufferutil/
      # cpu-features/dtrace-provider/utf-8-validate, never ssh2) — it never
      # revisits ssh2's self-managed nested build at lib/protocol/crypto/,
      # so a sshcrypto.node left there (compiled against this runner's plain
      # Node.js ABI, not Electron's — v0.1.20 through v0.1.22 all shipped it
      # this way despite allowScripts blocking ssh2's OWN install script;
      # something in npm ci's dependency resolution still produces this
      # directory) never gets fixed by the step above. electron-vite build
      # (next) then finds that mismatched-ABI binary sitting on disk and
      # copies it into a bundle chunk, permanently baking in the wrong ABI.
      # ssh2 already wraps this require in a try/catch with a full pure-JS
      # fallback (lib/protocol/crypto.js) — deleting the build output here
      # forces that fallback instead of shipping a binary that can never
      # load in Electron.
      - name: Remove ssh2's unrebuildable native crypto binding
        shell: bash
        run: |
          find node_modules/ssh2/lib/protocol/crypto -type f 2>&1 || true
          rm -rf node_modules/ssh2/lib/protocol/crypto/build

      - name: Build renderer and main bundles
        run: npm run build

      - name: Build installer
        run: npx electron-builder --win --x64 --publish never

      - name: Generate latest.yml
        shell: bash
        run: |
          # GitHub нормализует имена ассетов со спецсимволами (пробелы → точки),
          # поэтому latest.yml обязан ссылаться на нормализованное имя.
          VERSION="${{ steps.tag.outputs.version }}"
          EXE="release/Remote Hub Setup ${VERSION}.exe"
          NAME="Remote.Hub.Setup.${VERSION}.exe"
          node -e "
            const fs = require('fs');
            const crypto = require('crypto');
            const v = process.argv[1];
            const exe = process.argv[2];
            const name = process.argv[3];
            const buf = fs.readFileSync(exe);
            // electron-updater сверяет sha512 как base64-дайджест (не hex).
            const sha512 = crypto.createHash('sha512').update(buf).digest('base64');
            const size = buf.length;
            const date = new Date().toISOString();
            const yml =
              'version: ' + v + '\n' +
              'files:\n' +
              '  - url: ' + name + '\n' +
              '    sha512: ' + sha512 + '\n' +
              '    size: ' + size + '\n' +
              'path: ' + name + '\n' +
              'sha512: ' + sha512 + '\n' +
              'releaseDate: \\'' + date + '\\'\n';
            fs.writeFileSync('release/latest.yml', yml);
            console.log(yml);
          " "$VERSION" "$EXE" "$NAME"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            release/Remote Hub Setup ${{ steps.tag.outputs.version }}.exe
            release/latest.yml
